coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 75%

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "custom_components/private_hacs/__init__.py"
  - "custom_components/private_hacs/config_flow.py"
  - "custom_components/private_hacs/panel.py"
