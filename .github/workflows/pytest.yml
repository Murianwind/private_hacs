name: Pytest

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:  # 수동 실행 — GitHub Actions 탭에서 Run workflow 클릭

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 같은 브랜치에 연속 push가 있으면 이전 실행을 취소하고 마지막 push만 실행
concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-test.txt --quiet

      - name: Run Pytest
        run: |
          set +e
          pytest tests/ \
            --no-header \
            --tb=short \
            --color=no \
            --durations=5 \
            -p no:warnings \
            -v \
            2>&1 | tee pytest-output.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=$PYTEST_EXIT" >> $GITHUB_ENV
          exit $PYTEST_EXIT

      - name: Publish Test Summary
        if: always()
        run: |
          set +e  # grep이 매칭 없을 때 exit 1 반환해도 스크립트 계속 실행
          SUMMARY_LINE=$(grep -E "[0-9]+ (passed|failed|error)" pytest-output.txt | tail -1 || echo "결과 없음")

          # ── 헤더 + 요약 ──────────────────────────────────────────────
          if [ "${PYTEST_EXIT:-0}" = "0" ]; then
            echo "### ✅ Pytest 결과: 전체 통과" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Pytest 결과: 실패 있음" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**브랜치:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${SUMMARY_LINE}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 테스트 파일별 결과 요약 ────────────────────────────────
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📁 테스트 파일별 결과</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in test_github test_coordinator test_services test_store; do
            TOTAL=$(grep "tests/${f}.py::.*::test_\|tests/${f}.py::test_" pytest-output.txt 2>/dev/null | wc -l | tr -d ' ')
            PASS=$(grep "tests/${f}.py::.*PASSED" pytest-output.txt 2>/dev/null | wc -l | tr -d ' ')
            FAIL=$(grep "tests/${f}.py::.*FAILED" pytest-output.txt 2>/dev/null | wc -l | tr -d ' ')
            if [ "${TOTAL}" = "0" ]; then
              echo "⚠️  ${f}.py  — 수집 실패 (import 오류 등)" >> $GITHUB_STEP_SUMMARY
            elif [ "${FAIL}" -gt "0" ] 2>/dev/null; then
              echo "❌ ${f}.py  — ${PASS}/${TOTAL} 통과  (${FAIL} 실패)" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ ${f}.py  — ${PASS}/${TOTAL} 통과" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 실행된 테스트 전체 목록 (접기) ────────────────────────
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📋 실행된 테스트 전체 목록 (클릭하여 펼치기)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          {
            grep -E "PASSED|FAILED|ERROR|SKIPPED" pytest-output.txt \
              | grep "::" \
              | sed 's/  *\[[ 0-9]*%\]$//' \
              | sed 's/ PASSED$/  ✓/' \
              | sed 's/ FAILED$/  ✗  ← FAILED/' \
              | sed 's/ ERROR$/  !  ← ERROR/' \
              | sed 's/ SKIPPED$/  (skipped)/'
          } >> $GITHUB_STEP_SUMMARY || echo "(없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 수집 오류 ───────────────────────────────────────────────
          COLLECT_ERRORS=$(grep "ERROR collecting" pytest-output.txt 2>/dev/null || true)
          if [ -n "$COLLECT_ERRORS" ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ 수집 오류 (import 실패 등)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A3 "ERROR collecting" pytest-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # ── 실패 상세 ───────────────────────────────────────────────
          FAIL_COUNT=$(grep -cE "^FAILED " pytest-output.txt 2>/dev/null || echo 0)
          if [ "${FAIL_COUNT}" -gt "0" ] 2>/dev/null; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ 실패 상세" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**실패한 테스트:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep "^FAILED " pytest-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**Traceback (파일:라인):**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            awk '
              /^_{5,}/ { in_fail=1; print ""; print; next }
              in_fail && /^(FAILED|={5,})/ { in_fail=0; next }
              in_fail && /^[[:space:]]*(tests|custom_components)\/.*\.py:[0-9]+:/ { print; next }
              in_fail && /^E[[:space:]]/ { print; next }
            ' pytest-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**원인 분류:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            SRC=$(grep -oE "custom_components/[^ ]+\.py:[0-9]+" pytest-output.txt | sort -u || true)
            TEST=$(grep -oE "tests/[^ ]+\.py:[0-9]+" pytest-output.txt | sort -u || true)
            if [ -n "$SRC" ]; then
              echo "📦 소스 코드 문제 (custom_components/):" >> $GITHUB_STEP_SUMMARY
              echo "$SRC" >> $GITHUB_STEP_SUMMARY
              echo "  → coordinator.py / github.py / services.py 등 실제 코드 버그일 가능성" >> $GITHUB_STEP_SUMMARY
            else
              echo "📦 소스 코드 문제: 없음" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -n "$TEST" ]; then
              echo "🧪 테스트 코드 문제 (tests/):" >> $GITHUB_STEP_SUMMARY
              echo "$TEST" >> $GITHUB_STEP_SUMMARY
              echo "  → 테스트 assertion 또는 mock 설정 문제일 가능성" >> $GITHUB_STEP_SUMMARY
            else
              echo "🧪 테스트 코드 문제: 없음" >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
