install:
  name: "설치/업데이트"
  description: "지정한 컴포넌트를 설치하거나 업데이트합니다."
  fields:
    component_id:
      name: "컴포넌트 ID"
      required: true
      example: "my_integration"
      selector:
        text:
    branch:
      name: "브랜치"
      required: true
      example: "main"
      selector:
        text:
    ref:
      name: "버전 (태그/브랜치)"
      description: "설치할 특정 릴리즈 태그. 생략 시 최신 버전."
      required: false
      example: "v1.2.0"
      selector:
        text:

uninstall:
  name: "컴포넌트 삭제"
  description: "컴포넌트 파일을 삭제합니다. 저장소 등록은 유지됩니다. 브랜치와 무관하게 component_id 전체 파일을 삭제합니다."
  fields:
    component_id:
      name: "컴포넌트 ID"
      required: true
      example: "my_integration"
      selector:
        text:

refresh:
  name: "새로고침"
  description: "모든 저장소의 최신 버전 정보를 즉시 갱신합니다."

add_repo:
  name: "저장소 추가"
  description: "새 저장소를 Private HACS에 등록합니다."
  fields:
    repo:
      name: "저장소"
      required: true
      example: "your-org/your-private-integration"
      selector:
        text:
    name:
      name: "표시 이름"
      required: true
      example: "My Integration"
      selector:
        text:
    component_id:
      name: "컴포넌트 ID"
      required: true
      example: "my_integration"
      selector:
        text:
    branch:
      name: "브랜치"
      required: false
      example: "main"
      selector:
        text:

remove_repo:
  name: "저장소 등록 해제"
  description: "저장소 특정 브랜치 등록을 해제합니다. 파일과 버전 정보는 유지됩니다."
  fields:
    component_id:
      name: "컴포넌트 ID"
      required: true
      example: "my_integration"
      selector:
        text:
    branch:
      name: "브랜치"
      required: true
      example: "main"
      selector:
        text:

toggle_branch:
  name: "브랜치 활성/비활성"
  description: "등록된 브랜치를 활성화하거나 비활성화합니다."
  fields:
    component_id:
      name: "컴포넌트 ID"
      required: true
      example: "my_integration"
      selector:
        text:
    branch:
      name: "브랜치"
      required: true
      example: "dev"
      selector:
        text:
    active:
      name: "활성화 여부"
      required: true
      example: true
      selector:
        boolean:

get_repo_info:
  name: "저장소 정보 조회"
  description: "GitHub API로 저장소 정보를 조회합니다 (패널 내부용)."
  fields:
    repo:
      name: "저장소"
      required: true
      example: "your-org/your-integration"
      selector:
        text:

get_readme:
  name: "README 조회"
  description: "저장소의 README.md 내용을 조회합니다 (패널 내부용)."
  fields:
    repo:
      name: "저장소"
      required: true
      example: "your-org/your-integration"
      selector:
        text:
    branch:
      name: "브랜치"
      required: false
      example: "main"
      selector:
        text:

get_releases:
  name: "릴리즈 목록 조회"
  description: "저장소의 릴리즈 목록을 조회합니다 (패널 내부용)."
  fields:
    component_id:
      name: "컴포넌트 ID"
      required: true
      example: "my_integration"
      selector:
        text:
    branch:
      name: "브랜치"
      required: true
      example: "main"
      selector:
        text:
