<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private HACS</title>
<script src="/private_hacs_panel/js/marked.min.js"></script>
<style>
  :root {
    --primary: var(--primary-color, #03a9f4);
    --primary-dark: var(--dark-primary-color, #0288d1);
    --success: var(--success-color, #4caf50);
    --warning: var(--warning-color, #ff9800);
    --danger: var(--error-color, #f44336);
    --surface:  var(--primary-background-color, #1c1c1e);
    --surface2: var(--secondary-background-color, #2c2c2e);
    --surface3: var(--card-background-color, #3a3a3c);
    --text:     var(--primary-text-color, #e5e5ea);
    --text-secondary: var(--secondary-text-color, #98989f);
    --border:   var(--divider-color, rgba(0,0,0,.12));
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--paper-font-body1_-_font-family,
                 -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, 'Noto Sans KR', sans-serif);
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── Header ── */
  .header {
    background: var(--app-header-background-color, var(--primary-color, #03a9f4));
    color: var(--app-header-text-color, #fff);
    padding: 0 16px;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .header h1 { font-size: 18px; font-weight: 600; color: var(--app-header-text-color, #fff); }
  .header-actions { display: flex; gap: 8px; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border: none; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .header .btn { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .header .btn:hover { background: rgba(255,255,255,.35); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface3); color: var(--text); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { filter: brightness(1.1); }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover { filter: brightness(1.1); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  /* ── Main ── */
  .main { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

  /* ── Stats ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 8px; text-align: center; }
  .stat-number { font-size: 32px; font-weight: 700; color: var(--primary); line-height: 1.1; }
  .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  /* ── Filter bar ── */
  .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar input {
    flex: 1; min-width: 140px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  .filter-bar input::placeholder { color: var(--text-secondary); }
  .filter-bar input:focus { outline: none; border-color: var(--primary); }
  .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--text-secondary);
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ── Repo group (컴포넌트 단위 묶음) ── */
  .repo-grid { display: flex; flex-direction: column; gap: 12px; }

  .repo-group {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .repo-group:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .repo-group.has-update { border-left: 3px solid var(--warning); }

  /* 그룹 헤더 */
  .group-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .group-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--primary), #7c4dff);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; overflow: hidden;
  }
  .group-icon img { width: 28px; height: 28px; object-fit: contain; }
  .group-title {
    font-size: 15px; font-weight: 700;
    color: var(--text); cursor: pointer; transition: color .15s;
  }
  .group-title:hover { color: var(--primary); text-decoration: underline; }
  .group-component-id {
    font-size: 12px; color: var(--text-secondary);
    font-family: 'SFMono-Regular', Consolas, monospace;
    margin-top: 1px;
  }

  /* 브랜치 행 */
  .branch-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px 12px 20px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  .branch-row:last-child { border-bottom: none; }
  .branch-row.inactive { opacity: .5; }
  /* 비활성 브랜치: 재설치·삭제 버튼 비활성화, 토글·등록해제는 허용 */
  .branch-row.inactive .branch-actions .btn-success,
  .branch-row.inactive .branch-actions .btn-warning,
  .branch-row.inactive .branch-actions .btn-ghost:not(.btn-remove),
  .branch-row.inactive .branch-actions .btn-danger:not(.btn-remove) {
    pointer-events: none; opacity: .4;
  }

  .branch-label {
    display: flex; align-items: center; gap: 6px;
    min-width: 90px; flex-shrink: 0;
  }
  .branch-name {
    font-size: 13px; font-weight: 600;
    font-family: 'SFMono-Regular', Consolas, monospace;
    color: var(--primary);
    background: rgba(3,169,244,.1);
    padding: 2px 8px; border-radius: 10px;
  }

  .branch-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
  .branch-actions { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }

  /* ── Toggle switch ── */
  .toggle-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .toggle-label { font-size: 11px; color: var(--text-secondary); }
  .toggle {
    position: relative; width: 36px; height: 20px;
    display: inline-block; flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: #555; border-radius: 20px;
    cursor: pointer; transition: background .2s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; left: 3px; top: 3px;
    transition: transform .2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--primary); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

  /* ── Badges ── */
  .badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 9px; border-radius: 20px;
    font-size: 13px; font-weight: 500; font-family: inherit;
  }
  .badge-installed  { background: rgba(76,175,80,.15);  color: var(--success); }
  .badge-update     { background: rgba(255,152,0,.15);   color: var(--warning); }
  .badge-not-installed { background: var(--surface3); color: var(--text-secondary); }
  .badge-version    { background: var(--surface3); color: var(--text-secondary); font-size: 13px; }
  .badge-manifest   { background: rgba(124,77,255,.15); color: #9c7ae8; }
  .release-link { font-size: 13px; font-weight: 500; color: var(--primary); text-decoration: none; }
  .release-link:hover { text-decoration: underline; }
  .readme-link {
    font-size: 11px; font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    text-decoration: none;
    transition: all .15s;
    white-space: nowrap;
  }
  .readme-link:hover {
    color: var(--primary);
    border-color: var(--primary);
    background: rgba(3,169,244,.08);
  }

  /* ── Loading / empty ── */
  .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 15px; line-height: 1.6; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* ── Toast ── */
  .toast-container {
    position: fixed; bottom: 24px; right: 16px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 9999; pointer-events: none; max-width: calc(100vw - 32px);
  }
  .toast {
    background: #2c2c2e; background: var(--card-background-color, #2c2c2e);
    border: 1px solid #3a3a3c; border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius-sm);
    padding: 12px 16px; font-size: 14px; font-family: inherit;
    min-width: 240px; max-width: 360px; pointer-events: auto;
    animation: slideIn .25s ease; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error   { border-left: 3px solid var(--danger); }
  .toast.info    { border-left: 3px solid var(--primary); }
  .toast.warning { border-left: 3px solid var(--warning); }
  @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ── Modals ── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 500; align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #2c2c2e;
    background: var(--card-background-color, #2c2c2e);
    border: 1px solid #3a3a3c;
    border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius); padding: 24px;
    width: 92%; max-width: 480px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    max-height: 90vh; display: flex; flex-direction: column;
  }
  #readmeModal .modal { max-width: 760px; width: 95%; height: 85vh; }
  .modal h2 { font-size: 17px; font-weight: 600; color: #e5e5ea; color: var(--primary-text-color, #e5e5ea); margin-bottom: 18px; flex-shrink: 0; }
  .modal-field { margin-bottom: 14px; flex-shrink: 0; }
  .modal-field label { display: block; font-size: 13px; color: #98989f; color: var(--secondary-text-color, #98989f); margin-bottom: 5px; font-weight: 500; }
  .modal-field input {
    width: 100%;
    background: #1c1c1e; background: var(--secondary-background-color, #1c1c1e);
    border: 1px solid #3a3a3c; border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius-sm); padding: 10px 12px;
    color: #e5e5ea; color: var(--primary-text-color, #e5e5ea);
    font-size: 14px; font-family: inherit;
  }
  .modal-field input:focus { outline: none; border-color: var(--primary); }
  .modal-field .hint { font-size: 12px; color: #98989f; color: var(--secondary-text-color, #98989f); margin-top: 4px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; flex-shrink: 0; padding-top: 16px; }

  /* 저장소 미리보기 */
  .repo-preview {
    display: none;
    background: #1c1c1e; background: var(--secondary-background-color, #1c1c1e);
    border: 1px solid #3a3a3c; border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius-sm); padding: 12px; margin-top: 10px; font-size: 13px;
  }
  .repo-preview.visible { display: block; }
  .repo-preview-name { font-weight: 600; margin-bottom: 4px; color: #e5e5ea; color: var(--primary-text-color, #e5e5ea); font-size: 14px; }
  .repo-preview-desc { color: #98989f; color: var(--secondary-text-color, #98989f); }
  .repo-preview-component { color: var(--primary); font-size: 13px; margin-top: 6px; }

  /* 브랜치 선택 목록 */
  .branch-select-list {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 200px; overflow-y: auto;
    margin-top: 6px;
  }
  .branch-select-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    background: #1c1c1e; background: var(--secondary-background-color, #1c1c1e);
    border: 1px solid #3a3a3c; border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius-sm);
    cursor: pointer; transition: border-color .15s, background .15s;
    font-size: 13px;
  }
  .branch-select-item:hover { border-color: var(--primary); background: #2c2c2e; background: var(--surface2, #2c2c2e); }
  .branch-select-item.selected { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
  .branch-select-item.already-registered {
    opacity: .45; cursor: not-allowed;
  }
  .branch-select-item.already-registered:hover { border-color: #3a3a3c; border-color: var(--divider-color, #3a3a3c); background: #1c1c1e; background: var(--secondary-background-color, #1c1c1e); }
  .branch-item-radio {
    width: 14px; height: 14px; flex-shrink: 0;
    border: 2px solid #555; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .branch-select-item.selected .branch-item-radio { border-color: var(--primary); }
  .branch-select-item.selected .branch-item-radio::after {
    content: ''; width: 6px; height: 6px;
    border-radius: 50%; background: var(--primary); display: block;
  }
  .branch-item-name {
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 13px; font-weight: 600; color: var(--primary); flex: 1;
  }
  .branch-item-tag {
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
    background: rgba(76,175,80,.15); color: var(--success);
  }
  .branch-loading { text-align: center; padding: 16px 0; color: #98989f; font-size: 13px; }
  .branch-loading .spinner { width: 20px; height: 20px; border-width: 2px; margin: 0 auto 8px; }

  /* 릴리즈 선택 목록 */
  .release-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 360px; }
  .release-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid #3a3a3c; border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius-sm); cursor: pointer; transition: border-color .15s, background .15s;
    background: #2c2c2e; background: var(--secondary-background-color, #2c2c2e);
  }
  .release-item:hover { border-color: var(--primary); background: #3a3a3c; background: var(--surface3, #3a3a3c); }
  .release-item.selected { border-color: var(--primary); background: #3a3a3c; box-shadow: inset 3px 0 0 var(--primary); }
  .release-item-radio { width: 16px; height: 16px; flex-shrink: 0; border: 2px solid #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .release-item.selected .release-item-radio { border-color: var(--primary); }
  .release-item.selected .release-item-radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); display: block; }
  .release-item-info { flex: 1; min-width: 0; }
  .release-item-name { font-size: 14px; font-weight: 600; color: #e5e5ea; color: var(--primary-text-color, #e5e5ea); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .release-item-tag { font-size: 12px; color: var(--primary); font-family: monospace; margin-top: 1px; }
  .release-item-date { font-size: 12px; color: #98989f; flex-shrink: 0; }
  .release-item-badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: rgba(255,152,0,.15); color: var(--warning); flex-shrink: 0; }
  .release-current-badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: rgba(76,175,80,.15); color: var(--success); flex-shrink: 0; }

  /* README */
  .readme-content { flex: 1; overflow-y: auto; background: #0d1117; border: 1px solid #30363d; border-radius: var(--radius-sm); padding: 24px; color: #c9d1d9; font-size: 14px; line-height: 1.6; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-top: 20px; margin-bottom: 12px; color: #f0f6fc; }
  .markdown-body h1:first-child { margin-top: 0; }
  .markdown-body a { color: #58a6ff; text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body code { background: rgba(110,118,129,.4); padding: .2em .4em; border-radius: 4px; font-family: monospace; font-size: 85%; }
  .markdown-body pre { background: #161b22; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 16px; }
  .markdown-body pre code { background: none; padding: 0; font-size: 100%; color: #e6edf3; }
  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body blockquote { border-left: 4px solid #30363d; margin: 0; padding-left: 16px; color: #8b949e; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  .markdown-body th, .markdown-body td { border: 1px solid #30363d; padding: 8px 12px; }
  .markdown-body th { background: #161b22; color: #f0f6fc; }
  .markdown-body tr:nth-child(2n) { background: #161b22; }
  .markdown-body ul, .markdown-body ol { padding-left: 24px; margin-bottom: 12px; }
  .markdown-body li { margin-bottom: 4px; }

  /* ── Confirm ── */
  .confirm-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 600; align-items: center; justify-content: center;
  }
  .confirm-backdrop.open { display: flex; }
  .confirm-box {
    background: #2c2c2e;
    background: var(--card-background-color, #2c2c2e);
    border: 1px solid #3a3a3c;
    border: 1px solid var(--divider-color, #3a3a3c);
    border-radius: var(--radius); padding: 24px;
    width: 90%; max-width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
  }
  .confirm-box h3 { margin-bottom: 10px; font-size: 16px; color: #e5e5ea; color: var(--primary-text-color, #e5e5ea); }
  .confirm-box p { font-size: 14px; color: #98989f; color: var(--secondary-text-color, #98989f); margin-bottom: 20px; line-height: 1.6; white-space: pre-line; }
  .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 480px) {
    .branch-row { flex-wrap: wrap; }
    .branch-actions { width: 100%; }
    .stats { gap: 8px; }
    .stat-number { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">🔒</div>
    <h1>Private HACS</h1>
  </div>
  <div class="header-actions">
    <button class="btn btn-sm" onclick="refreshAll()" id="refreshBtn">🔄 새로고침</button>
    <button class="btn btn-sm" onclick="openAddModal()" style="background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.4);">＋ 저장소 추가</button>
  </div>
</div>

<div class="main">
  <div class="stats" id="stats" style="display:none">
    <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">전체 저장소</div></div>
    <div class="stat-card"><div class="stat-number" id="statInstalled">0</div><div class="stat-label">설치됨</div></div>
    <div class="stat-card"><div class="stat-number" id="statUpdates" style="color:var(--warning)">0</div><div class="stat-label">업데이트 가능</div></div>
  </div>

  <div class="filter-bar" id="filterBar" style="display:none">
    <input type="text" placeholder="저장소 검색..." id="searchInput" oninput="renderRepos()">
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setTab('all',this)">전체</button>

<script>
// ── 상태 ──
let repos = [];
let activeTab = 'all';
const busyKeys = new Set();

let _pendingRepoInfo = null;
let _repoLookupTimer = null;

const $el = id => window.__privateHacsPanel
  ? window.__privateHacsPanel.querySelector('#' + id)
  : document.getElementById(id);

// ── WS ──
async function getAuthToken() {
  if (typeof window.__privateHacsGetToken === 'function') return window.__privateHacsGetToken();
  return Promise.reject(new Error('패널이 올바르게 로드되지 않았습니다.'));
}
let ws = null, msgId = 1;
const pendingRequests = {};

async function connectWS() {
  const token = await getAuthToken();
  return new Promise((resolve, reject) => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/api/websocket');
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'auth_required') ws.send(JSON.stringify({ type: 'auth', access_token: token }));
      else if (msg.type === 'auth_ok') resolve();
      else if (msg.type === 'auth_invalid') reject(new Error('HA 인증 실패'));
      else if (msg.id && pendingRequests[msg.id]) { pendingRequests[msg.id](msg); delete pendingRequests[msg.id]; }
    };
    ws.onerror = () => reject(new Error('WebSocket 연결 오류'));
  });
}
function wsSend(msg) {
  return new Promise(resolve => {
    const id = msgId++;
    pendingRequests[id] = resolve;
    ws.send(JSON.stringify({ ...msg, id }));
  });
}
async function callService(domain, service, data) {
  return wsSend({ type: 'call_service', domain, service, service_data: data });
}

// ── 데이터 패치 ──
async function fetchRepos() {
  const [statesRes, regRes] = await Promise.all([
    wsSend({ type: 'get_states' }),
    wsSend({ type: 'config/entity_registry/list' }),
  ]);
  const states = statesRes.result || [];
  const reg = regRes.result || [];

  // private_hacs 플랫폼 엔티티 id → unique_id 매핑
  const hacsEntities = {};
  reg.filter(e => e.platform === 'private_hacs').forEach(e => {
    hacsEntities[e.entity_id] = e.unique_id || '';
  });

  return states
    .filter(s => s.entity_id.startsWith('update.') && hacsEntities[s.entity_id] !== undefined)
    .map(s => {
      const a = s.attributes;

      // branch: extra_state_attributes에서 직접 읽는 것이 가장 정확
      // 없으면 unique_id(repo_{component_id}_{branch})에서 추출 시도
      let branch = a.branch;
      let component_id;

      const uid = hacsEntities[s.entity_id];

      if (branch) {
        // branch 속성이 있으면 entity_id에서 역산
        component_id = s.entity_id
          .replace(/^update\./, '')
          .replace(/_update$/, '');
        const suffix = '_' + branch;
        if (component_id.endsWith(suffix)) {
          component_id = component_id.slice(0, -suffix.length);
        }
      } else {
        // branch 속성이 없는 경우 — unique_id에서 추출
        // 신형 unique_id만 허용: repo_{component_id}_{branch}
        // component_id에 _가 포함될 수 있으므로 branch가 확실히 존재할 때만 파싱
        // __init__.py의 cleanup이 실행되기 전 레거시(repo_{component_id}) 엔티티를 여기서도 걸러냄
        if (!uid.startsWith('repo_') || uid.split('_').length < 3) return null;
        // 마지막 _ 이후가 branch
        const lastUnderscore = uid.lastIndexOf('_');
        branch = uid.slice(lastUnderscore + 1);
        component_id = uid.slice('repo_'.length, lastUnderscore);
        if (!branch || !component_id) return null;
      }

      if (!component_id || !branch) return null;

      const entry_key = component_id + '@' + branch;
      const installed = a.installed_version || s.installed_version || null;
      const latest = a.latest_version || s.latest_version || null;
      const hasUpdate = s.state === 'on';
      // active: 엔티티 attributes에서 읽음
      // available=True로 고정했으므로 a.active가 항상 정확히 전달됨
      // unavailable 상태(a가 비어있는 경우) 대비해 명시적으로 false 기본값 사용
      const active = (s.state !== 'unavailable' && a.active !== undefined)
        ? Boolean(a.active)
        : (s.state !== 'unavailable');

      const rawName = a.friendly_name || s.entity_id;
      let cleanName = rawName.replace(/ update$/i, '').replace(/ \([^)]+\)$/, '');
      if (cleanName.startsWith('Private HACS ')) cleanName = cleanName.slice(13);

      let repoUrl = '';
      if (a.release_url) {
        const m2 = a.release_url.match(/github\.com\/([^\/]+\/[^\/]+)/);
        if (m2) repoUrl = m2[1].replace(/\/(tree|releases|commits).*$/, '');
      }

      return {
        entity_id: s.entity_id, entry_key, component_id, branch,
        name: cleanName, repo_url: repoUrl,
        installed_version: installed, latest_version: latest,
        installed_commit_sha: a.installed_commit_sha || null,
        release_url: a.release_url || null,
        has_update: hasUpdate, is_installed: !!installed,
        active,
        update_mode: a.update_mode || 'release',
        version_source: a.version_source || (installed ? 'store' : 'none'),
        latest_type: a.latest_type || null,
        has_icon: a.has_icon || false,
      };
    })
    .filter(Boolean); // null 제거
}

async function loadData() {
  try { repos = await fetchRepos(); }
  catch (err) {
    toast('데이터 로드 실패: ' + err.message, 'error', 8000);
    $el('repoGrid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>데이터를 불러오지 못했습니다.<br>' + err.message + '</p></div>';
    return;
  }
  $el('stats').style.display = 'grid';
  $el('filterBar').style.display = 'flex';
  renderAll();
}

function renderAll() { updateStats(); renderRepos(); }

function updateStats() {
  // 컴포넌트 수는 고유 component_id 수
  const compIds = new Set(repos.map(r => r.component_id));
  $el('statTotal').textContent = compIds.size;
  // 설치됨: 활성 브랜치 중 설치된 것
  $el('statInstalled').textContent = repos.filter(r => r.active && r.is_installed).length;
  // 업데이트: 활성 브랜치 중 업데이트 가능
  $el('statUpdates').textContent = repos.filter(r => r.active && r.has_update).length;
}

function setTab(tab, btn) {
  activeTab = tab;
  (window.__privateHacsPanel || document).querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRepos();
}

// ── 그룹핑 렌더링 ──
function renderRepos() {
  const q = ($el('searchInput') ? $el('searchInput').value : '').toLowerCase();
  const grid = $el('repoGrid');

  // 필터 적용 후 component_id로 그룹핑
  const filtered = repos.filter(r => {
    const matchQ = !q || r.name.toLowerCase().includes(q) || r.component_id.includes(q) || r.branch.includes(q);
    const matchTab =
      activeTab === 'installed' ? (r.active && r.is_installed) :
      activeTab === 'updates'   ? (r.active && r.has_update) :
      activeTab === 'not_installed' ? (!r.is_installed) : true;
    return matchQ && matchTab;
  });

  if (filtered.length === 0) {
    grid.innerHTML = repos.length === 0
      ? '<div class="empty"><div class="empty-icon">📦</div><p>등록된 저장소가 없습니다.<br>우상단 <b>＋ 저장소 추가</b> 버튼으로 추가하세요.</p></div>'
      : '<div class="empty"><div class="empty-icon">🔍</div><p>검색 결과가 없습니다.</p></div>';
    return;
  }

  // 같은 component_id끼리 묶기 (등록 순서 유지)
  const groupMap = new Map();
  filtered.forEach(r => {
    if (!groupMap.has(r.component_id)) groupMap.set(r.component_id, []);
    groupMap.get(r.component_id).push(r);
  });

  grid.innerHTML = Array.from(groupMap.entries()).map(([cid, branches]) => groupHTML(cid, branches)).join('');
}

function groupHTML(componentId, branches) {
  const first = branches[0];
  const hasAnyUpdate = branches.some(b => b.active && b.has_update);

  const iconContent = first.has_icon
    ? '<img src="/private_hacs_icons/' + componentId + '/brand/icon.png" onerror="this.outerHTML=\'🧩\'">'
    : '🧩';

  // 아이콘/제목 클릭 → GitHub 저장소로 이동
  const repoHref = first.repo_url ? 'https://github.com/' + first.repo_url : null;
  const iconClick = repoHref
    ? 'onclick="window.open(\'' + esc(repoHref) + '\',\'_blank\')" style="cursor:pointer"' : '';
  const titleClick = repoHref
    ? 'onclick="window.open(\'' + esc(repoHref) + '\',\'_blank\')" style="cursor:pointer"' : '';

  // README 링크 — 제목 옆 작은 버튼
  const readmeLink = first.repo_url
    ? '<a href="javascript:void(0)" onclick="openReadmeModal(\'' + esc(first.repo_url) + '\',\'' + esc(first.name) + '\')" class="readme-link" title="README 보기">README</a>'
    : '';

  const branchRows = branches.map(r => branchRowHTML(r)).join('');

  return '<div class="repo-group' + (hasAnyUpdate ? ' has-update' : '') + '">'
    + '<div class="group-header">'
    + '<div class="group-icon" ' + iconClick + '>' + iconContent + '</div>'
    + '<div style="flex:1;min-width:0;">'
    + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
    + '<div class="group-title" ' + titleClick + '>' + esc(first.name) + '</div>'
    + readmeLink
    + '</div>'
    + '<div class="group-component-id">' + esc(componentId) + '</div>'
    + '</div>'
    + '</div>'
    + branchRows
    + '</div>';
}

function branchRowHTML(r) {
  const busy = busyKeys.has(r.entry_key);
  const inactive = !r.active;

  const statusBadge = r.is_installed
    ? (r.has_update ? '<span class="badge badge-update">⬆ 업데이트</span>' : '<span class="badge badge-installed">✓ 최신</span>')
    : '<span class="badge badge-not-installed">미설치</span>';

  const sourceBadge = r.version_source === 'manifest'
    ? '<span class="badge badge-manifest">📄 자동 감지</span>' : '';

  // SHA: installed_commit_sha가 있으면 항상 표시 (latest_type 무관)
  const shaStr = r.installed_commit_sha
    ? '/' + String(r.installed_commit_sha).slice(0, 7) : '';
  const installedBadge = r.installed_version
    ? '<span class="badge badge-version">설치: ' + esc(r.installed_version) + esc(shaStr) + '</span>' : '';
  const latestBadge = r.has_update && r.latest_version
    ? '<span class="badge badge-version">최신: ' + esc(r.latest_version) + '</span>' : '';

  // 커밋 로그 vs 릴리즈 노트: release_url이 /commits/ 경로면 커밋 로그
  const isCommitUrl = r.release_url && r.release_url.includes('/commits/');
  const linkLabel = isCommitUrl ? '커밋 로그 ↗' : '릴리즈 노트 ↗';
  const releaseLink = r.release_url
    ? '<a href="' + esc(r.release_url) + '" target="_blank" class="release-link">' + linkLabel + '</a>' : '';

  // 릴리즈/태그 타입 여부 — 재설치 버튼 동작 결정
  const isReleaseType = r.latest_type === 'release' || r.latest_type === 'tag';

  // update_mode 배지 — default_branch(저장소 첫 등록 브랜치)가 아닌 브랜치만 변경 가능
  const isDefaultBranch = repos.filter(r2 => r2.component_id === r.component_id)
    .findIndex(r2 => r2.branch === r.branch) === 0;
  const updateModeBadge = r.update_mode === 'commit'
    ? '<span class="badge" style="background:rgba(124,77,255,.15);color:#9c7ae8;cursor:' + (isDefaultBranch ? 'default' : 'pointer') + '" '
      + (isDefaultBranch ? '' : 'onclick="setUpdateMode(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'release\')" title="릴리즈 모드로 변경"')
      + '>커밋 추적</span>'
    : '<span class="badge" style="background:rgba(3,169,244,.1);color:var(--primary);cursor:' + (isDefaultBranch ? 'default' : 'pointer') + '" '
      + (isDefaultBranch ? '' : 'onclick="setUpdateMode(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'commit\')" title="커밋 추적 모드로 변경"')
      + '>릴리즈</span>';
  const isSingleBranch = repos.filter(repo => repo.component_id === r.component_id).length <= 1;
  const toggleDisabled = busy || isSingleBranch;

  // 토글 스위치
  const toggleHtml = '<div class="toggle-wrap">'
    + '<label class="toggle"'
    + (isSingleBranch ? ' title="브랜치가 하나뿐인 저장소는 비활성화할 수 없습니다"' : '')
    + '><input type="checkbox"' + (r.active ? ' checked' : '')
    + (toggleDisabled ? ' disabled' : '')
    + ' onchange="toggleBranch(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',this.checked)">'
    + '<span class="toggle-slider"></span></label>'
    + '</div>';

  let actions = '';
  if (busy) {
    actions = '<button class="btn btn-primary btn-sm" disabled>⏳ 처리 중...</button>';
  } else if (!r.is_installed) {
    actions = '<button class="btn btn-success btn-sm" onclick="install(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">⬇ 설치</button>'
      + '<button class="btn btn-danger btn-sm btn-remove" onclick="removeRepo(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">등록 해제</button>';
  } else if (r.has_update) {
    actions = '<button class="btn btn-warning btn-sm" onclick="install(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">⬆ 업데이트</button>'
      + '<button class="btn btn-danger btn-sm" onclick="uninstall(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">컴포넌트 삭제</button>'
      + '<button class="btn btn-ghost btn-sm btn-remove" onclick="removeRepo(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">등록 해제</button>';
  } else {
    // 재설치: 릴리즈/태그 타입이면 릴리즈 선택 모달, 커밋 타입이면 confirm 후 재설치
    const reinstallBtn = isReleaseType
      ? '<button class="btn btn-ghost btn-sm" onclick="openReleaseModal(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\',\'' + esc(r.installed_version || '') + '\')">🔄 재설치</button>'
      : '<button class="btn btn-ghost btn-sm" onclick="reinstall(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">🔄 재설치</button>';
    actions = reinstallBtn
      + '<button class="btn btn-danger btn-sm" onclick="uninstall(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">컴포넌트 삭제</button>'
      + '<button class="btn btn-ghost btn-sm btn-remove" onclick="removeRepo(\'' + esc(r.component_id) + '\',\'' + esc(r.branch) + '\',\'' + esc(r.name) + '\')">등록 해제</button>';
  }

  return '<div class="branch-row' + (inactive ? ' inactive' : '') + '">'
    + toggleHtml
    + '<div class="branch-label"><span class="branch-name">' + esc(r.branch) + '</span></div>'
    + '<div class="branch-meta">' + statusBadge + sourceBadge + updateModeBadge + installedBadge + latestBadge + releaseLink + '</div>'
    + '<div class="branch-actions">' + actions + '</div>'
    + '</div>';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 브랜치 토글 ──
async function toggleBranch(componentId, branch, active) {
  const key = componentId + '@' + branch;
  const r = repos.find(r => r.component_id === componentId && r.branch === branch);
  const name = r ? r.name : componentId;

  if (!active) {
    // 비활성화: 같은 component_id 브랜치가 1개뿐이면 차단
    const siblings = repos.filter(r => r.component_id === componentId);
    if (siblings.length <= 1) {
      toast('브랜치가 하나뿐인 저장소는 비활성화할 수 없습니다.', 'warning', 4000);
      // 체크박스 UI 원래대로 복원
      renderRepos();
      return;
    }
    // 비활성화: 상태 변경만
    if (r) r.active = false;
    renderAll();
    try {
      await callService('private_hacs', 'toggle_branch', {
        component_id: componentId, branch, active: false,
      });
      toast(name + ' (' + branch + ') 비활성화됨', 'info', 2500);
    } catch (err) {
      toast('비활성화 실패: ' + err.message, 'error');
      if (r) r.active = true;
      renderAll();
    }
    return;
  }

  // 활성화: 같은 component_id의 다른 브랜치 로컬에서 즉시 비활성화
  repos.forEach(repo => {
    if (repo.component_id === componentId) {
      repo.active = repo.branch === branch;
    }
  });
  busyKeys.add(key);
  renderAll();
  toast(name + ' (' + branch + ') 활성화 중...', 'info', 4000);

  try {
    // 1단계: 활성화 상태 저장 (설치 없이)
    await callService('private_hacs', 'toggle_branch', {
      component_id: componentId, branch, active: true,
    });

    // 서버 refresh 후 최신 상태 반영
    await new Promise(res => setTimeout(res, 1500));
    repos = await fetchRepos();
    busyKeys.delete(key);
    renderAll();

    // 2단계: 커밋 기반 저장소(branch 타입)이고 업데이트가 있을 때만 팝업
    const updated = repos.find(r => r.component_id === componentId && r.branch === branch);
    const isBranchType = updated && updated.latest_type === 'branch';
    const needsInstall = isBranchType && updated.has_update;

    if (needsInstall) {
      showConfirm(
        '브랜치 설치',
        name + ' (' + branch + ') 브랜치로 전환하시겠습니까?\n\n현재 설치된 파일과 다른 커밋입니다.\n지금 설치하면 해당 브랜치의 최신 커밋으로 파일이 교체됩니다.\n설치 후 HA를 재시작해야 적용됩니다.\n\n취소하면 활성화만 되고 나중에 수동으로 설치할 수 있습니다.',
        async () => {
          busyKeys.add(key); renderRepos();
          toast(name + ' (' + branch + ') 설치 중...', 'info');
          try {
            await callService('private_hacs', 'install', { component_id: componentId, branch });
            toast(name + ' (' + branch + ') 설치 완료! HA를 재시작해야 적용됩니다.', 'success', 7000);
            repos = await fetchRepos(); renderAll();
          } catch (err) {
            toast('설치 실패: ' + err.message, 'error', 6000);
          } finally {
            busyKeys.delete(key); renderRepos();
          }
        }
        // 취소: 활성화만 된 상태, 업데이트 버튼으로 표시됨
      );
    } else {
      // 최신 커밋과 일치하거나 릴리즈/태그 타입 — 팝업 없이 활성화 완료
      if (updated && updated.has_update) {
        toast(name + ' (' + branch + ') 활성화됨. 업데이트가 있습니다.', 'success', 5000);
      } else {
        toast(name + ' (' + branch + ') 활성화됨.', 'success', 3000);
      }
    }
  } catch (err) {
    toast('활성화 실패: ' + err.message, 'error', 6000);
    repos = await fetchRepos(); renderAll();
  } finally {
    busyKeys.delete(key);
    renderRepos();
  }
}

}

async function removeRepo(componentId, branch, name) {
  const r = repos.find(r => r.component_id === componentId && r.branch === branch);
  const isActive = r && r.active;
  const siblings = repos.filter(r => r.component_id === componentId && r.branch !== branch);
  const hasSiblings = siblings.length > 0;

  let confirmMsg = name + ' (' + branch + ') 브랜치를 Private HACS에서 제거하시겠습니까?\n\n설치된 파일은 자동으로 삭제되지 않습니다.';

  if (isActive && hasSiblings) {
    confirmMsg += '\n\n⚠️ 현재 활성화된 브랜치입니다.\n등록 해제 후 다른 브랜치를 직접 활성화해야 합니다.';
  } else if (isActive && !hasSiblings) {
    confirmMsg += '\n\n⚠️ 현재 활성화된 브랜치이며 다른 등록된 브랜치가 없습니다.\n등록 해제 후 활성 브랜치가 없는 상태가 됩니다.';
  }

  showConfirm('저장소 등록 해제', confirmMsg,
    async () => {
      try {
        await callService('private_hacs', 'remove_repo', { component_id: componentId, branch });
        toast(name + ' (' + branch + ') 등록 해제 완료.', 'success');
        // 서버에서 최신 상태 읽기 — 자동 활성화 반영
        await new Promise(r => setTimeout(r, 500));
        repos = await fetchRepos(); renderAll();
      } catch (err) {
        toast('등록 해제 실패: ' + err.message, 'error', 6000);
      }
    });
}

// ── 릴리즈 선택 모달 ──
let _releaseModalState = { componentId: null, branch: null, name: null, releases: [], selectedTag: null, installedVersion: null };

async function openReleaseModal(componentId, branch, name, installedVersion) {
  _releaseModalState = { componentId, branch, name, releases: [], selectedTag: null, installedVersion };
  console.log('[Private HACS] openReleaseModal installedVersion:', installedVersion);
  $el('releaseSelectTitle').textContent = name + ' (' + branch + ') — 버전 선택';
  $el('releaseInstallBtn').disabled = true;
  $el('releaseList').innerHTML = '<div style="text-align:center;padding:40px 0;color:#98989f"><div class="spinner" style="width:28px;height:28px;border-width:2px;margin:0 auto 10px"></div>릴리즈 목록 불러오는 중...</div>';
  $el('releaseSelectModal').classList.add('open');
  try {
    const res = await wsSend({
      type: 'call_service', domain: 'private_hacs', service: 'get_releases',
      service_data: { component_id: componentId, branch },
      return_response: true,
    });
    if (res.error) throw new Error(res.error.message || '조회 실패');
    const releases = ((res.result && res.result.response) || res.response || res.result || {}).releases || [];
    _releaseModalState.releases = releases;
    renderReleaseList(releases, installedVersion);
  } catch (err) {
    $el('releaseList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>' + esc(err.message) + '</p></div>';
  }
}

function renderReleaseList(releases, installedVersion) {
  console.log('[Private HACS] renderReleaseList installedVersion:', installedVersion, 'releases:', releases.map(r => r.tag_name));
  // v 접두사 정규화 — "3.0.7"과 "v3.0.7" 모두 같은 버전으로 처리
  const normalizeVer = v => v ? String(v).replace(/^v/, '') : '';
  const normalizedInstalled = normalizeVer(installedVersion);
  if (!releases.length) {
    $el('releaseList').innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>릴리즈가 없습니다.</p></div>';
    return;
  }
  $el('releaseList').innerHTML = releases.map((r, idx) => {
    const isCurrent = normalizedInstalled && normalizeVer(r.tag_name) === normalizedInstalled;
    const nameDisplay = (r.name && r.name !== r.tag_name)
      ? '<div class="release-item-name">' + esc(r.name) + '</div><div class="release-item-tag">' + esc(r.tag_name) + '</div>'
      : '<div class="release-item-name">' + esc(r.tag_name) + '</div>';
    return '<div class="release-item" data-idx="' + idx + '" onclick="selectRelease(' + idx + ')">'
      + '<div class="release-item-radio"></div>'
      + '<div class="release-item-info">' + nameDisplay + '</div>'
      + (r.prerelease ? '<span class="release-item-badge">pre</span>' : '')
      + (isCurrent ? '<span class="release-current-badge">현재</span>' : '')
      + (r.published_at ? '<span class="release-item-date">' + esc(r.published_at) + '</span>' : '')
      + '</div>';
  }).join('');
}

function selectRelease(idx) {
  if (!_releaseModalState.releases[idx]) return;
  _releaseModalState.selectedTag = _releaseModalState.releases[idx].tag_name;
  $el('releaseList').querySelectorAll('.release-item').forEach(el => el.classList.remove('selected'));
  const target = $el('releaseList').querySelector('[data-idx="' + idx + '"]');
  if (target) target.classList.add('selected');
  $el('releaseInstallBtn').disabled = false;
}

async function confirmReleaseInstall() {
  const { componentId, branch, name, selectedTag, installedVersion } = _releaseModalState;
  if (!selectedTag) return;
  const isSame = installedVersion && selectedTag === installedVersion;
  const label = isSame ? '재설치' : '설치';
  closeReleaseModal();
  const key = componentId + '@' + branch;
  busyKeys.add(key); renderRepos();
  toast(name + ' ' + selectedTag + ' ' + label + ' 중...', 'info');
  try {
    await callService('private_hacs', 'install', { component_id: componentId, branch, ref: selectedTag });
    toast(name + ' ' + selectedTag + ' ' + label + ' 완료! HA를 재시작해야 적용됩니다.', 'success', 6000);
    repos = await fetchRepos(); renderAll();
  } catch (err) {
    toast(label + ' 실패: ' + err.message, 'error', 6000);
  } finally { busyKeys.delete(key); renderRepos(); }
}

function closeReleaseModal() {
  $el('releaseSelectModal').classList.remove('open');
  _releaseModalState = { componentId: null, branch: null, name: null, releases: [], selectedTag: null, installedVersion: null };
}

// ── 저장소 추가 모달 ──
function _parseRepoInput(val) {
  val = val.trim();
  const m = val.match(/github\.com\/([a-zA-Z0-9_\-]+\/[a-zA-Z0-9_\-\.]+)/);
  if (m) return m[1].replace(/\.git$/, '');
  if (/^[a-zA-Z0-9_\-]+\/[a-zA-Z0-9_\-\.]+$/.test(val)) return val;
  return null;
}

function openAddModal() {
  _pendingRepoInfo = null;
  $el('addRepo').value = '';
  $el('repoPreview').classList.remove('visible');
  $el('branchField').style.display = 'none';
  $el('branchSelectList').innerHTML = '';
  $el('addSubmitBtn').disabled = true;
  $el('addModal').classList.add('open');
  setTimeout(() => { const el = $el('addRepo'); if (el) el.focus(); }, 50);
}

function handleRepoInput(e) {
  const repo = _parseRepoInput(e.target.value);
  $el('repoPreview').classList.remove('visible');
  $el('branchField').style.display = 'none';
  $el('branchSelectList').innerHTML = '';
  $el('addSubmitBtn').disabled = true;
  _pendingRepoInfo = null;
  clearTimeout(_repoLookupTimer);
  if (!repo) return;
  _repoLookupTimer = setTimeout(() => lookupRepo(repo), 800);
}

async function lookupRepo(repo) {
  $el('repoPreview').classList.add('visible');
  $el('previewName').textContent = '조회 중...';
  $el('previewDesc').textContent = '';
  $el('previewComponent').textContent = '';
  $el('branchField').style.display = 'none';
  $el('addSubmitBtn').disabled = true;
  _pendingRepoInfo = null;

  try {
    const res = await wsSend({
      type: 'call_service', domain: 'private_hacs', service: 'get_repo_info',
      service_data: { repo }, return_response: true,
    });
    if (res.error) throw new Error(res.error.message || '조회 실패');
    const info = (res.result && res.result.response) || res.response || {};
    const componentIds = info.component_ids || [];
    const componentId = componentIds.length ? componentIds[0] : repo.split('/')[1].replace(/-/g,'_').toLowerCase();
    const allBranches = info.branches || [];
    const defaultBranch = info.default_branch || 'main';
    const hasReleases = info.has_releases === true;

    // 이미 등록된 브랜치 목록 (같은 component_id 기준)
    const registeredBranches = new Set(
      repos.filter(r => r.component_id === componentId).map(r => r.branch)
    );

    // 릴리즈가 있는 저장소이고 같은 component_id 기존 브랜치가 있을 때만 모드 선택 표시
    const showModeSelect = registeredBranches.size > 0 && hasReleases;

    _pendingRepoInfo = {
      repo, name: info.name || repo.split('/')[1],
      component_id: componentId,
      branch: null,
      defaultBranch,
      hasExisting: showModeSelect,
      update_mode: showModeSelect ? 'commit' : (registeredBranches.size > 0 ? 'commit' : 'release'),
    };

    $el('previewName').textContent = info.full_name || repo;
    $el('previewDesc').textContent = info.description || '';
    $el('previewComponent').textContent = componentIds.length > 1
      ? 'component_id: ' + componentId + ' (' + componentIds.join(', ') + ' 중 첫 번째)'
      : 'component_id: ' + componentId;

    // 브랜치 선택 목록 표시
    $el('branchField').style.display = 'block';
    renderBranchSelectList(allBranches, registeredBranches, defaultBranch);

  } catch (err) {
    $el('previewName').textContent = '조회 실패: ' + err.message;
    $el('branchField').style.display = 'none';
  }
}

function renderBranchSelectList(allBranches, registeredBranches, defaultBranch) {
  const list = $el('branchSelectList');
  if (!allBranches.length) {
    list.innerHTML = '<div class="branch-loading">브랜치 정보를 불러오지 못했습니다.</div>';
    return;
  }
  list.innerHTML = allBranches.map(branch => {
    const isRegistered = registeredBranches.has(branch);
    const isDefault = branch === defaultBranch;
    const cls = 'branch-select-item' + (isRegistered ? ' already-registered' : '');
    const defaultTag = isDefault ? '<span class="branch-item-tag">기본</span>' : '';
    const registeredTag = isRegistered ? '<span style="font-size:11px;color:#98989f;margin-left:4px">등록됨</span>' : '';
    const onclick = isRegistered ? '' : 'onclick="selectBranchItem(this)"';
    return '<div class="' + cls + '" data-branch="' + esc(branch) + '" ' + onclick + '>'
      + '<div class="branch-item-radio"></div>'
      + '<span class="branch-item-name">' + esc(branch) + '</span>'
      + defaultTag + registeredTag
      + '</div>';
  }).join('');
}

function selectBranchItem(el) {
  const branch = el.dataset.branch;
  $el('branchSelectList').querySelectorAll('.branch-select-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  if (_pendingRepoInfo && branch) {
    _pendingRepoInfo.branch = branch;
    // 기존 등록 브랜치가 있으면(두 번째 이상) update_mode 선택 UI 표시
    if (_pendingRepoInfo.hasExisting) {
      $el('updateModeField').style.display = 'block';
      selectUpdateMode(_pendingRepoInfo.update_mode || 'commit');
    } else {
      $el('updateModeField').style.display = 'none';
    }
    $el('addSubmitBtn').disabled = false;
  }
}

function selectUpdateMode(mode) {
  if (!_pendingRepoInfo) return;
  _pendingRepoInfo.update_mode = mode;
  const btnRelease = $el('modeBtnRelease');
  const btnCommit = $el('modeBtnCommit');
  const hint = $el('updateModeHint');
  // 선택된 버튼: 배경색 강조, 미선택: ghost
  if (mode === 'release') {
    btnRelease.style.cssText = 'flex:1;background:var(--primary);color:#fff;border-color:var(--primary)';
    btnCommit.style.cssText = 'flex:1;background:transparent;color:var(--text-secondary);border:1px solid var(--border)';
    hint.textContent = '릴리즈/태그 기준으로 업데이트합니다.';
  } else {
    btnRelease.style.cssText = 'flex:1;background:transparent;color:var(--text-secondary);border:1px solid var(--border)';
    btnCommit.style.cssText = 'flex:1;background:var(--primary);color:#fff;border-color:var(--primary)';
    hint.textContent = '해당 브랜치의 커밋 기준으로 업데이트합니다.';
  }
}

async function submitAddRepo() {
  if (!_pendingRepoInfo || !_pendingRepoInfo.branch) {
    toast('브랜치를 선택해주세요.', 'warning'); return;
  }
  const { repo, name, component_id, branch, update_mode } = _pendingRepoInfo;
  const btn = $el('addSubmitBtn');
  btn.disabled = true; btn.textContent = '추가 중...';

    await callService('private_hacs', 'add_repo', {
      repo, name, component_id, branch,
      update_mode: update_mode || 'release',
    });
    closeAddModal();
    toast(name + ' (' + branch + ') 저장소가 추가됐습니다. 잠시 후 목록에 표시됩니다.', 'success', 6000);
    await new Promise(r => setTimeout(r, 5000));
    repos = await fetchRepos(); renderAll();
  } catch (err) {
    toast('저장소 추가 실패: ' + err.message, 'error', 6000);
    btn.disabled = false; btn.textContent = '추가';
  }
}

function closeAddModal() {
  $el('addModal').classList.remove('open');
  _pendingRepoInfo = null;
  const btn = $el('addSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '추가'; }
  const inp = $el('addRepo');
  if (inp) inp.value = '';
  const prev = $el('repoPreview');
  if (prev) prev.classList.remove('visible');
  const bf = $el('branchField');
  if (bf) bf.style.display = 'none';
  const bsl = $el('branchSelectList');
  if (bsl) bsl.innerHTML = '';
  const umf = $el('updateModeField');
  if (umf) umf.style.display = 'none';
}

// ── Confirm / Toast ──
function showConfirm(title, msg, cb) {
  $el('confirmTitle').textContent = title;
  $el('confirmMsg').textContent = msg;
  $el('confirmOkBtn').onclick = () => { closeConfirm(); cb(); };
  $el('confirmBackdrop').classList.add('open');
}
function closeConfirm() { $el('confirmBackdrop').classList.remove('open'); }

function toast(msg, type, duration) {
  type = type || 'info'; duration = duration || 3500;
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span>' + (icons[type]||'') + '</span><span>' + msg + '</span>';
  $el('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

if (!window._privateHacsKeydown) {
  window._privateHacsKeydown = true;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeReleaseModal(); closeAddModal(); closeReadmeModal(); closeConfirm();
    }
  });
}

(async function() {
  try { await connectWS(); await loadData(); }
  catch (err) {
    $el('repoGrid').innerHTML = '<div class="empty"><div class="empty-icon">🔌</div>'
      + '<p>' + err.message + '<br><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="location.reload()">새로고침</button></p></div>';
  }
})();
</script>
</body>
</html>
